<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ミライシード</title>
  <link
    rel="icon"
    href="https://cdn.imagetourls.com/uploads/tyImg/FrP2hQ52.png"
    type="image/png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }

    .image-screen {
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .image-screen img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .links {
      padding: 32px 20px 48px;
      background: #111;
    }

    .links h1 {
      margin: 0 0 20px;
      font-size: 1.4rem;
    }

    .links a {
      display: block;
      max-width: 600px;
      margin: 10px 0;
      padding: 14px 16px;
      border-radius: 8px;
      background: #222;
      color: #fff;
      text-decoration: none;
    }

    .links a:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <main>
    <section class="image-screen">
      <img
        src="https://cdn.imagetourls.com/uploads/tyImg/11XEdjqiG.png"
        alt="画像"
      >
    </section>

    <section class="links">
      <h1>リンク</h1>
      <a href="https://script.google.com/a/macros/ed-tachikawa.jp/s/AKfycbxm0tNsWUp7nhFboWBgldo4diYLQIHKCB1YaCa2OI6gwe50HxuEbRb5wHh53rjaaWwArw/exec
">動く静止画</a>
      <a href="https://virtualpiano.io/ja/">音が出そう</a>
      <a href="https://quickdraw.withgoogle.com/#">AIOKAKI</a>
      <a href="https://nevercap.ai/resources/youtube-to-mp4">動静止画入手</a>
    </section>
  </main>
</body>
</html>
